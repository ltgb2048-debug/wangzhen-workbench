name: Build Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WangzhenWorkbench.csproj

      - name: Build
        run: dotnet build WangzhenWorkbench.csproj -c Release --no-restore

      - name: Publish self-contained win-x64
        run: dotnet publish WangzhenWorkbench.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o publish

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: WangzhenWorkbench-win-x64
          path: publish/**
          if-no-files-found: error
